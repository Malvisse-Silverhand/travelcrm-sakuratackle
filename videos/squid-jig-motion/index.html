<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Squid jigging loop — Sakura Tackle</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: #1b1436;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #scene svg {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      A 6 s seamless loop for the Sakura Tackle homepage welcome card: a
      squid circling a candat jig under the boat's green lamps. Every tween
      repeats on a period that divides 6 s (1, 1.5, 2, 3, 6), so frame 0 and
      frame 6 s match and the web <video loop> has no seam.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1080"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0b0820" />
              <stop offset="1" stop-color="#241a52" />
            </linearGradient>
            <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2e1d6b" />
              <stop offset="0.55" stop-color="#1f1650" />
              <stop offset="1" stop-color="#0d0a24" />
            </linearGradient>
            <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5dff9c" stop-opacity="0.55" />
              <stop offset="1" stop-color="#5dff9c" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="lampGlow">
              <stop offset="0" stop-color="#d6ffe6" />
              <stop offset="0.35" stop-color="#5dff9c" stop-opacity="0.9" />
              <stop offset="1" stop-color="#5dff9c" stop-opacity="0" />
            </radialGradient>
            <radialGradient id="mantle" cx="0.4" cy="0.3" r="0.8">
              <stop offset="0" stop-color="#e9dcff" />
              <stop offset="0.55" stop-color="#b79cff" />
              <stop offset="1" stop-color="#7d5fe0" />
            </radialGradient>
            <linearGradient id="jigBody" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#ffcf4d" />
              <stop offset="0.5" stop-color="#ffb800" />
              <stop offset="1" stop-color="#e08a00" />
            </linearGradient>
          </defs>

          <!-- sky and sea -->
          <rect x="0" y="0" width="1080" height="250" fill="url(#sky)" />
          <rect x="0" y="230" width="1080" height="850" fill="url(#sea)" />
          <g id="stars" fill="#ffffff">
            <circle cx="90" cy="60" r="2.4" />
            <circle cx="210" cy="120" r="1.8" />
            <circle cx="340" cy="45" r="2" />
            <circle cx="480" cy="95" r="1.6" />
            <circle cx="960" cy="70" r="2.2" />
            <circle cx="1020" cy="150" r="1.6" />
            <circle cx="160" cy="185" r="1.4" />
          </g>

          <!-- green light falling into the water -->
          <polygon id="cone" points="640,232 820,232 1040,1080 380,1080" fill="url(#cone)" opacity="0.2" />

          <!-- boat hull and candat lamps -->
          <path
            d="M430 150 L1080 150 L1080 236 L470 236 Q440 236 430 210 Z"
            fill="#120d2b"
          />
          <path d="M430 150 L1080 150 L1080 166 L432 166 Z" fill="#ffb800" />
          <g id="lamps">
            <g transform="translate(600 196)">
              <circle id="glow1" r="60" fill="url(#lampGlow)" opacity="0.85" />
              <rect x="-14" y="-18" width="28" height="20" rx="4" fill="#2a2e31" />
              <circle r="8" fill="#eafff1" />
            </g>
            <g transform="translate(730 196)">
              <circle id="glow2" r="60" fill="url(#lampGlow)" opacity="0.85" />
              <rect x="-14" y="-18" width="28" height="20" rx="4" fill="#2a2e31" />
              <circle r="8" fill="#eafff1" />
            </g>
            <g transform="translate(860 196)">
              <circle id="glow3" r="60" fill="url(#lampGlow)" opacity="0.85" />
              <rect x="-14" y="-18" width="28" height="20" rx="4" fill="#2a2e31" />
              <circle r="8" fill="#eafff1" />
            </g>
          </g>

          <!-- water surface: a periodic wave slid by exactly one wavelength -->
          <g id="waveWrap" data-layout-allow-overflow>
            <path
              id="wave"
              d="M-240 236 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V246 H-240 Z"
              fill="#8f7cff"
              opacity="0.35"
            />
          </g>

          <!-- plankton specks in the lamp light -->
          <g id="plankton" fill="#c8ffdc">
            <circle class="pk" cx="560" cy="420" r="3" opacity="0.6" />
            <circle class="pk" cx="880" cy="520" r="2.5" opacity="0.5" />
            <circle class="pk" cx="640" cy="760" r="3" opacity="0.5" />
            <circle class="pk" cx="930" cy="860" r="2" opacity="0.6" />
            <circle class="pk" cx="300" cy="420" r="2.5" opacity="0.4" />
            <circle class="pk" cx="180" cy="760" r="2" opacity="0.45" />
          </g>

          <!-- the jig on its line -->
          <line id="line" x1="730" y1="204" x2="730" y2="560" stroke="#e8e1ff" stroke-width="2.4" opacity="0.8" />
          <g transform="translate(730 560)">
            <g id="jig">
              <g id="jigTilt">
                <ellipse cx="0" cy="58" rx="22" ry="62" fill="url(#jigBody)" />
                <path d="M-22 40 Q0 30 22 40" stroke="#2e1d6b" stroke-width="3" fill="none" opacity="0.5" />
                <path d="M-20 70 Q0 60 20 70" stroke="#2e1d6b" stroke-width="3" fill="none" opacity="0.5" />
                <circle cx="-7" cy="18" r="5" fill="#1b1436" />
                <circle cx="-5.5" cy="16.5" r="1.6" fill="#ffffff" />
                <!-- umbrella of hooks -->
                <g stroke="#e8e1ff" stroke-width="3" fill="none" stroke-linecap="round">
                  <path d="M0 120 L-26 146" />
                  <path d="M0 120 L-13 152" />
                  <path d="M0 120 L0 156" />
                  <path d="M0 120 L13 152" />
                  <path d="M0 120 L26 146" />
                </g>
                <rect x="-6" y="114" width="12" height="10" rx="3" fill="#5dff9c" />
              </g>
            </g>
          </g>

          <!-- bubbles -->
          <g id="bubbles" fill="none" stroke="#d6ccff" stroke-width="2.5">
            <circle class="bubble" cx="440" cy="0" r="9" />
            <circle class="bubble" cx="470" cy="0" r="6" />
            <circle class="bubble" cx="520" cy="0" r="7" />
            <circle class="bubble" cx="760" cy="0" r="5" />
            <circle class="bubble" cx="400" cy="0" r="5" />
            <circle class="bubble" cx="800" cy="0" r="8" />
          </g>

          <!-- the squid -->
          <g transform="translate(410 640)">
            <g id="squid">
              <g id="squidLean">
                <!-- tentacles, drawn first so the mantle sits over their roots -->
                <g id="tentacles" stroke-linecap="round" fill="none">
                  <path class="tent" d="M-58 80 q-18 60 -4 120" stroke="#9a7ff0" stroke-width="18" />
                  <path class="tent" d="M-30 86 q-10 70 2 134" stroke="#a88cf6" stroke-width="18" />
                  <path class="tent" d="M0 88 q0 72 0 138" stroke="#b39af9" stroke-width="18" />
                  <path class="tent" d="M30 86 q10 70 -2 134" stroke="#a88cf6" stroke-width="18" />
                  <path class="tent" d="M58 80 q18 60 4 120" stroke="#9a7ff0" stroke-width="18" />
                </g>
                <!-- the two long feeding arms that reach for the jig -->
                <g id="arms" fill="none" stroke-linecap="round">
                  <path d="M42 70 q120 -10 190 -90" stroke="#c7b2ff" stroke-width="10" />
                  <circle cx="232" cy="-20" r="13" fill="#c7b2ff" />
                  <path d="M50 92 q130 10 200 -60" stroke="#bba3ff" stroke-width="10" />
                  <circle cx="250" cy="32" r="13" fill="#bba3ff" />
                </g>
                <!-- fins -->
                <path d="M-62 -150 L-128 -100 L-70 -86 Z" fill="#a88cf6" />
                <path d="M62 -150 L128 -100 L70 -86 Z" fill="#a88cf6" />
                <!-- mantle -->
                <path
                  d="M0 -230 C70 -200 98 -60 92 40 C88 92 50 104 0 104 C-50 104 -88 92 -92 40 C-98 -60 -70 -200 0 -230 Z"
                  fill="url(#mantle)"
                />
                <!-- chromatophore spots -->
                <g fill="#7d5fe0" opacity="0.35">
                  <circle cx="-30" cy="-140" r="9" />
                  <circle cx="20" cy="-165" r="7" />
                  <circle cx="38" cy="-110" r="10" />
                  <circle cx="-48" cy="-80" r="7" />
                  <circle cx="10" cy="-95" r="6" />
                </g>
                <!-- face -->
                <g id="eyes">
                  <circle cx="-36" cy="20" r="27" fill="#ffffff" />
                  <circle cx="36" cy="20" r="27" fill="#ffffff" />
                  <g id="pupils">
                    <circle cx="-30" cy="18" r="15" fill="#1b1436" />
                    <circle cx="42" cy="18" r="15" fill="#1b1436" />
                    <circle cx="-25" cy="12" r="5" fill="#ffffff" />
                    <circle cx="47" cy="12" r="5" fill="#ffffff" />
                  </g>
                  <!-- eyelids for the blink -->
                  <rect id="lidL" x="-64" y="-8" width="56" height="56" rx="28" fill="#b79cff" />
                  <rect id="lidR" x="8" y="-8" width="56" height="56" rx="28" fill="#b79cff" />
                </g>
                <ellipse cx="-62" cy="56" rx="13" ry="8" fill="#ff8fc4" opacity="0.55" />
                <ellipse cx="62" cy="56" rx="13" ry="8" fill="#ff8fc4" opacity="0.55" />
                <path d="M-12 62 Q0 74 12 62" stroke="#1b1436" stroke-width="4" fill="none" stroke-linecap="round" />
              </g>
            </g>
          </g>
        </svg>
      </div>
    </div>
    <script>
      const D = 6;
      const tl = gsap.timeline({ paused: true });

      // Jigging: a sharp lift, then a slow sink — one stroke every 2 s,
      // as one keyframed tween per element repeated three times.
      const stroke = (lift, settle) => ({
        keyframes: [
          { ...lift, duration: 0.28, ease: "power3.out" },
          { ...settle, duration: 1.72, ease: "sine.inOut" },
        ],
        repeat: 2,
      });
      tl.set("#jig", { y: 0 }, 0);
      tl.to("#jig", stroke({ y: -80 }, { y: 0 }), 0);
      tl.set("#line", { attr: { y2: 560 } }, 0);
      tl.to("#line", stroke({ attr: { y2: 480 } }, { attr: { y2: 560 } }), 0);
      tl.set("#jigTilt", { rotation: 0, svgOrigin: "0 0" }, 0);
      tl.to("#jigTilt", stroke({ rotation: -7 }, { rotation: 0 }), 0);

      // Squid hovers on a 2 s bob.
      tl.fromTo("#squid", { y: 10 }, { y: -12, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

      // Tentacles sway in alternating phase, 1 s each way.
      gsap.utils.toArray(".tent").forEach((el, i) => {
        const a = i % 2 === 0 ? 7 : -7;
        tl.fromTo(
          el,
          { rotation: a },
          { rotation: -a, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 0%" },
          0
        );
      });

      // The lunge: lean in and stretch the feeding arms at the jig, then settle.
      tl.fromTo(
        "#squidLean",
        { rotation: -4, x: 0 },
        { rotation: 6, x: 34, duration: 0.45, ease: "back.out(2)", svgOrigin: "0 0" },
        2.9
      );
      tl.to("#squidLean", { rotation: -4, x: 0, duration: 1.6, ease: "sine.inOut", svgOrigin: "0 0" }, 3.6);
      tl.fromTo("#arms", { scale: 0.86 }, { scale: 1.08, duration: 0.45, ease: "back.out(2)", svgOrigin: "40 80" }, 2.9);
      tl.to("#arms", { scale: 0.86, duration: 1.6, ease: "sine.inOut", svgOrigin: "40 80" }, 3.6);

      // Eyes follow the jig's strokes; one blink.
      tl.fromTo("#pupils", { y: 0 }, { y: -5, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      tl.fromTo(["#lidL", "#lidR"], { scaleY: 0 }, { scaleY: 1, duration: 0.09, ease: "power1.in", transformOrigin: "50% 0%" }, 4.6);
      tl.to(["#lidL", "#lidR"], { scaleY: 0, duration: 0.12, ease: "power1.out", transformOrigin: "50% 0%" }, 4.69);

      // Lamp light breathes; each lamp offset by its own phase.
      tl.fromTo("#cone", { opacity: 0.16 }, { opacity: 0.26, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      ["#glow1", "#glow2", "#glow3"].forEach((id, i) => {
        const lo = i === 1 ? 0.95 : 0.7;
        const hi = i === 1 ? 0.7 : 0.95;
        tl.fromTo(id, { opacity: lo }, { opacity: hi, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      });

      // Surface slides exactly one wavelength (120 px) over the loop.
      tl.fromTo("#waveWrap", { x: 0 }, { x: 120, duration: D, ease: "none" }, 0);

      // Plankton drift on a 3 s figure, alternating directions.
      gsap.utils.toArray(".pk").forEach((el, i) => {
        const dx = i % 2 ? 14 : -14;
        tl.fromTo(el, { x: -dx, y: 0 }, { x: dx, y: -10, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      });

      // Bubbles rise 3 s from the squid to the surface. Each starts part-way
      // up (its phase) so they never move in step, and the three segments sum
      // to exactly 6 s so the loop closes.
      const BOTTOM = 600;
      const TOP = 250;
      const phases = [0.1, 0.45, 0.8, 0.25, 0.62, 0.95];
      gsap.utils.toArray(".bubble").forEach((el, i) => {
        const p = phases[i];
        const rise = 3;
        const at = BOTTOM - (BOTTOM - TOP) * p;
        const first = (1 - p) * rise;
        tl.fromTo(el, { attr: { cy: at } }, { attr: { cy: TOP }, duration: first, ease: "none" }, 0);
        tl.fromTo(el, { attr: { cy: BOTTOM } }, { attr: { cy: TOP }, duration: rise, ease: "none" }, first);
        tl.fromTo(el, { attr: { cy: BOTTOM } }, { attr: { cy: at }, duration: rise - first, ease: "none" }, first + rise);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
